<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>联系我们 | Xhero</title>
    <link rel="stylesheet" href="../assets/site.css?v=20260617-3" />
  </head>
  <body data-page="contact">
    <header class="site-header">
      <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/xhero-logo.png?v=20260617-3" alt="Xhero 希罗石化" /></a>
      <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span></button>
      <nav class="main-nav" aria-label="主导航">
        <a href="../index.html">首页</a><a href="../products/index.html">产品中心</a><a href="../industries/index.html">应用行业</a><a href="../about/index.html">关于我们</a><a href="../contact/index.html">联系我们</a>
      </nav>
    </header>
    <main>
      <section class="sub-hero">
        <div class="sub-hero-inner reveal">
          <p class="eyebrow">Contact</p>
          <h1>获取润滑选型与应用支持</h1>
          <p>请提供设备类型、运行工况、现用油品或目标需求，希罗团队将协助进行产品匹配、资料提供、样品沟通与商务对接。</p>
        </div>
      </section>
      <section class="section contact-layout">
        <form class="contact-form glass reveal">
          <label>姓名 / 公司<input type="text" placeholder="例如：某某设备有限公司" /></label>
          <label>关注产品<select><option>设备用油</option><option>DuraHyd 抗磨液压油</option><option>DuraSlide 导轨油</option><option>Duramult 主轴油</option><option>DuraKnit 针织机油</option><option>XheroGel 润滑脂</option><option>Tomo 金属加工液</option><option>Anti-ios 防锈油</option></select></label>
          <label>需求说明<textarea placeholder="请填写工况、设备型号、所需资料或采购规格"></textarea></label>
          <button class="btn primary" type="button" data-fake-submit>生成咨询摘要</button>
          <p class="form-note" role="status"></p>
        </form>
        <div class="glass contact-card reveal">
          <h2>联系希罗</h2>
          <p>邮箱：marketing@xhero-oil.com.cn</p>
          <p>地址：上海市青浦区胜利路1358号</p>
          <p>服务内容：产品资料、技术选型、样品沟通、商务合作与售后支持。</p>
        </div>
      </section>
    </main>
    <script src="../assets/site.js?v=20260617-3"></script>
  </body>
</html>
